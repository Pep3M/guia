# Stack completo autohospedado: base de datos con pgvector, modelos locales,
# almacenamiento de objetos y la aplicación.
#
#   cp .env.example .env      # define al menos POSTGRES_PASSWORD y BETTER_AUTH_SECRET
#   docker compose up -d
#
# El servicio `ollama-init` descarga los modelos y crea la variante de chat con
# la ventana de contexto ampliada. La primera vez tarda: son varios GB.
#
# Perfiles opcionales:
#   --profile minio    almacenamiento de objetos compatible con S3
#   --profile tools    diagnóstico y siembra de la demostración
#
# Para GPU NVIDIA añade el override:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Para usar un proveedor externo de modelos en lugar de los locales, apunta
# AI_BASE_URL y AI_API_KEY a donde corresponda y no levantes `ollama`.

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-guia}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guia} -d ${POSTGRES_DB:-guia}"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Descarga los modelos y crea la variante de chat con num_ctx ampliado.
  # Corre una vez y termina; volver a levantarlo no repite las descargas.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_BASE_MODEL: ${OLLAMA_BASE_MODEL:-qwen2.5:14b-instruct}
      CHAT_MODEL: ${CHAT_MODEL:-guia-chat}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
    volumes:
      - ./docker/ollama:/modelfiles:ro
    entrypoint: ["/bin/sh", "/modelfiles/bootstrap.sh"]
    restart: "no"

  # Almacenamiento de objetos compatible con S3. Sólo hace falta si quieres
  # STORAGE_DRIVER=s3 en lugar del disco local: replicación, varias réplicas de
  # la aplicación compartiendo archivos, o backups con herramientas de S3.
  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-guia}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?define S3_SECRET_ACCESS_KEY para usar MinIO}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Crea el bucket la primera vez. Corre una vez y termina.
  minio-init:
    image: minio/mc:latest
    profiles: ["minio"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-guia}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-guia}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY_ID $$S3_SECRET_ACCESS_KEY &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      echo '[minio] bucket'  $$S3_BUCKET 'listo'
      "
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-guia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-guia}
      AI_BASE_URL: ${AI_BASE_URL:-http://ollama:11434/v1}
      CHAT_MODEL: ${CHAT_MODEL:-guia-chat}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_PATH: /data/storage
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - app-storage:/data/storage

  # Tareas puntuales: diagnóstico del entorno y siembra de la demostración.
  #   docker compose --profile tools run --rm tools bun run doctor
  #   docker compose --profile tools run --rm tools bun run demo:seed
  tools:
    build:
      context: .
      target: tools
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-guia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-guia}
      AI_BASE_URL: ${AI_BASE_URL:-http://ollama:11434/v1}
      CHAT_MODEL: ${CHAT_MODEL:-guia-chat}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_PATH: /data/storage
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
    volumes:
      - app-storage:/data/storage
    restart: "no"

volumes:
  db-data:
  ollama-data:
  minio-data:
  app-storage:
